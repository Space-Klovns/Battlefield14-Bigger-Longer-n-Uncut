- type: reagent
  id: BF14Nanoblood
  name: reagent-name-nanoblood
  group: Medicine
  desc: reagent-desc-nanoblood
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#6e0606"
  metabolisms:
    Bloodstream: # BF14-BLU: was Medicine
      effects:
      - !type:ModifyBloodLevel
        amount: 10 # ~33% blood in 5u, for 10 poison
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Nanoblood
          max: 5.5 # BF14
        damage:
          types:
            Poison: 1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Nanoblood
          min: 5.5
          max: 10 # BF14
        damage:
          types:
            Poison: 3.5 # TGMC parity lol
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Nanoblood
          min: 10
        damage:
          types:
            Poison: 7.5 # TGMC parity lol
      - !type:ModifyStatusEffect # BF14-BLU: was GenericStatusEffect
        type: Add
        effectProto: StatusEffectDrowsiness
        time: 3

- type: reagent
  id: BF14Meralyne
  name: reagent-name-meralyne
  group: Medicine
  desc: reagent-desc-meralyne
  physicalDesc: reagent-physical-desc-thick
  flavor: syrupy
  color: "#FD5964"
  metabolisms:
    Bloodstream: # BF14-BLU: was Medicine
      metabolismRate: 0.2
      effects:
      - !type:EvenHealthChange
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Meralyne
          max: 15.5
        damage:
          Brute: -2
      - !type:ModifyBleed # BF14-BLU: was ModifyBleedAmount
        amount: -0.75
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Meralyne
          min: 15.5
          max: 25.5
        damage:
          types:
            Heat: 2
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Meralyne
          min: 25.5
        damage:
          types:
            Blunt: 2
            Heat: 4
            Poison: 4
      - !type:Vomit # BF14-BLU: was ChemVomit
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Meralyne
          min: 30
        probability: 0.02
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Meralyne
          max: 15.5
        visualType: Medium
        messages: ["medicine-effect-brute1", "medicine-effect-brute2", "medicine-effect-brute3"]
        type: Local
        probability: 0.1
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14Meralyne
          min: 15.5
        visualType: MediumCaution
        messages: ["reagent-effect-overdose1", "reagent-effect-overdose2", "reagent-effect-overdose3"]
        type: Local
        probability: 0.2

