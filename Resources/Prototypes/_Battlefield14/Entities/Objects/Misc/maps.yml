- type: entity
  parent: BaseBattlemap
  id: BF14MapTaurus
  name: 'map (taurus)'
  description: "It's a map of Taurus, Florida. The red squares mark objectives. To use, place on the floor, hover over the item, and tap E on the keyboard."
  components:
    - type: Item
      size: Tiny
      storedSprite:
        sprite: _Battlefield14/Objects/Misc/maps.rsi
        state: taurus-storage
    - type: Sprite
      sprite: _Battlefield14/Objects/Misc/maps.rsi
      state: taurus
      scale: 0.7, 0.7
    - type: TabletopGame
      size: 190, 200
      setup:
        !type:TabletopEmptySetup
        boardPrototype: BF14PhotoMapTaurus

