- type: reagent
  id: BF14GassyGas
  name: reagent-name-bf14-gassy-gas # BF14-BLU: was plain text
  group: Toxins
  desc: reagent-desc-bf14-gassy-gas # BF14-BLU: was plain text
  physicalDesc: reagent-physical-desc-irritating
  flavor: bitter
  color: "#09ff00"
  boilingPoint: 583.15 # BF14-BLU: 310 -> 583.15, Kelvin
  meltingPoint: 368.15 # BF14-BLU: 95 -> 368.15, Kelvin
  metabolisms:
    Bloodstream: # BF14-BLU: was Narcotic
      metabolismRate: 0.15
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Large
        probability: 0.15
        messages:
        - generic-reagent-effect-burning-eyes
        - generic-reagent-effect-burning-eyes-a-bit
        - generic-reagent-effect-tearing-up
        - norepinephricacid-effect-eyes-itch
        - norepinephricacid-effect-eye-pain
      - !type:PopupMessage
        type: Local
        visualType: LargeCaution
        probability: 0.08
        messages:
        - norepinephricacid-effect-vision-fade
        - norepinephricacid-effect-vision-fail
        - norepinephricacid-effect-eye-disconnect
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14GassyGas
          min: 3
      - !type:Drunk
        boozePower: 4
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14GassyGas
          min: 2
      - !type:MovementSpeedModifier # BF14-BLU: was MovespeedModifier
        walkSpeedModifier: 0.7
        sprintSpeedModifier: 0.6
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14GassyGas
          min: 2
      - !type:Vomit # BF14-BLU: was ChemVomit
        probability: 0.4
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14GassyGas
          min: 1.5
      - !type:ModifyStatusEffect # BF14-BLU: was GenericStatusEffect
        effectProto: StatusEffectStutter
        probability: 0.5
      - !type:ModifyStatusEffect # BF14-BLU: was GenericStatusEffect
        effectProto: StatusEffectBlindness
        probability: 0.4
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14GassyGas
          min: 0.5
      - !type:Emote
        emote: Cough
        showInChat: true
        probability: 0.3
      - !type:Emote
        emote: Gasp
        showInChat: true
        probability: 0.15
      - !type:ModifyParalysis # BF14-BLU: was Paralyze
        probability: 0.2
        time: 0.5
        conditions:
        - !type:ReagentCondition # BF14-BLU: was ReagentThreshold
          reagent: BF14GassyGas
          min: 2
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 3
      - !type:Emote
        emote: Scream
        probability: 0.15

- type: reagent
