- type: entity
  id: BF14Bullet43x30mmThermobaric
  name: 43x30mm thermobaric grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 80
        Piercing: 50
    deleteOnCollide: true
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: BF14Thermobaric
    totalIntensity: 30
    intensitySlope: 6
    maxIntensity: 3
    maxTileBreak: 0
  - type: SpawnOnTrigger
    proto: BF14InstantEffectGravityWellThermobaric
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/ballistic.rsi
    layers:
    - state: grenade
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 3
    color: orange
    energy: 0.5

# BF14-BLU: ported from Battlefield14

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BF14Bullet43x30mmThermobaricArmingDistance
  name: 43x30mm thermobaric grenade
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Projectiles/ballistic.rsi
    layers:
    - state: grenade
  - type: Projectile
    damage:
      types:
        Structural: 50
        Blunt: 40
    deleteOnCollide: true
  - type: KsSubmunitionProjectile
    submunitionPrototype: BF14Bullet43x30mmThermobaric
    distanceDelay: 5
    submunitionDelay: 0
    submunitionCount: 1
    spreadAngle: 0
    velocityMultiplier: 1
  - type: StaminaDamageOnCollide
    damage: 20
