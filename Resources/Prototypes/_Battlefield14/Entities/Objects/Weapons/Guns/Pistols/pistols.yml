- type: entity
  name: desert eagle
  parent: BaseWeaponPistol
  id: BF14WeaponPistolILDeagle
  description: The deagle, a well known and very impractical handgun. Chambered in the large .50 Action express it packs a punch.
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Pistols/deagle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 5
    maxAngle: 15
    angleIncrease: 5
    angleDecay: 6
    fireRate: 5
    projectileSpeed: 30
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BF14DeagleGunshots
      params:
        volume: -3
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Battlefield14/Weapons/Guns/Glock17/rack.ogg
      params:
        volume: -1
    soundBoltOpened:
      path: /Audio/_Battlefield14/Weapons/Guns/Glock17/lock.ogg
      params:
        volume: -1
    soundBoltClosed:
      path: /Audio/_Battlefield14/Weapons/Guns/Glock17/chamber.ogg
      params:
        volume: -1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: BF14MagazinePistolDeagle
        insertSound: /Audio/_Battlefield14/Weapons/Guns/Glock17/magin.ogg
        ejectSound: /Audio/_Battlefield14/Weapons/Guns/Glock17/magout.ogg
        priority: 2
        whitelist:
          tags:
            - BF14MagazinePistolDeagle
      gun_chamber:
        name: Chamber
        startingItem: BF14CartridgePistol50AE
        priority: 1
        whitelist:
          tags:
            - BF14CartridgePistol50AE
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

