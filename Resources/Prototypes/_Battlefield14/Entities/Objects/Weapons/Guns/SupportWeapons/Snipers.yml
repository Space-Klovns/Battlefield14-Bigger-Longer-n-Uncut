- type: entity
  name: Mk-14 EBR
  parent: BF14WeaponRifleUSM14
  id: BF14WeaponSniperUSM14EBR
  description: The M14 was kindof a flop, it tried to be too many things at once. After it was replaced it had a second life as a designated marksman rifle, even recieving this upgraded chassis.
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Snipers/M14EBR.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/Snipers/M14EBR.rsi
  - type: GunRequiresWield
  - type: GunWieldBonus # needed so min angle doesn't go negative
    minAngle: 0
    maxAngle: 0
  - type: Gun
    fireRate: 4
    minAngle: 0
    maxAngle: 15
    angleIncrease: 5.5
    angleDecay: 13
    projectileSpeed: 50
    soundGunshot:
      collection: BF14M14Gunshots
      params:
        volume: -5
        variation: 0.125
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 10
    pvsIncrease: 0.8
  - type: SpeedModifiedOnWield
    walkModifier: 0.80
    sprintModifier: 0.80
  - type: Appearance
  - type: StaticPrice
    price: 3000
  - type: KsWieldedCrosshair
    crosshair:
      sprite: _Battlefield14/Interface/MousePointer/optics.rsi
      state: acog

