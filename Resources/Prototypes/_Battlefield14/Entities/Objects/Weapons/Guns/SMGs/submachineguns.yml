- type: entity
  name: MAC-10
  parent: BaseWeaponSubMachineGun
  id: BF14WeaponSubmachinegunUSMAC10
  description: "A cheap, compact, and concealable package, can give you a belly full of lead in less than a second. This weapon can be stored on your auxillary suit storage slot."
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/SMGs/M10.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      offset: 0.2, 0
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
      offset: 0.2, 0
  - type: Clothing
    sprite: null
    quickEquip: false
    slots:
    - Back
    - suitStorage
    - SUITSTORAGE2
    clothingVisuals:
      suitstorage2:
      - state: null
  - type: Gun
    minAngle: 3
    maxAngle: 30
    fireRate: 15
    angleIncrease: 2
    angleDecay: 20
    projectileSpeed: 35 # pistol caliber
    availableModes:
    - FullAuto
    soundGunshot:
      collection: BF14MP5Gunshots
      params:
        volume: -5
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_rack.ogg
      params:
        volume: -3
    soundBoltClosed:
      path: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_slap.ogg
      params:
        volume: -3
    soundBoltOpened:
      path: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_chlock.ogg
      params:
        volume: -3
        variation: 0.125
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: BF14MagazineSubmachinegunMAC10
        insertSound: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_magin.ogg
        ejectSound: /Audio/_Battlefield14/Weapons/Guns/MP5/uc_mp5_magout.ogg
        priority: 2
        whitelist:
          tags:
            - BF14MagazinePistolMAC10
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BF14CartridgePistol9x19
        priority: 1
        whitelist:
          tags:
            - BF14CartridgePistol9x19
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: BF14WeaponSubmachinegunUSMAC10
  id: BF14WeaponSubmachinegunUSMAC10Supp
  name: MAC-10 SUPP.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/SMGs/M10.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: supp
  - type: Gun
