- type: entity
  name: AK-74
  parent: BaseWeaponRifle
  id: BF14BaseWeaponRifleRUAK74
  description: "The communist response to the success of the M16. Takes AK-74 pattern magazines."
  abstract: true
  components:
  - type: Item
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AK/AK74.rsi
  - type: Icon
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AK/iconstates.rsi
    state: icon-ak74
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AK/iconstates.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: stock-ak74
      - state: grip-ak74
      - state: handguard-ak74
      - state: barrel-ak74
      - state: ironsight-ak74
      - state: mag-ak74-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AK/AK74.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -47
    maxAngle: -30
  - type: Gun
    minAngle: 50 # 3
    maxAngle: 50 # 20
    angleIncrease: 2
    angleDecay: 80
    availableModes:
    - SemiAuto
    - FullAuto
    selectedMode: FullAuto
    fireRate: 10.8 # 650 RPM
    projectileSpeed: 45
    soundGunshot:
      collection: BF14AK545Gunshots
      params:
        volume: -5
        variation: 0.125
  - type: ChamberMagazineAmmoProvider
    boltClosed: null # means the bolt doesnt lock back like M16 pattern rifles, also means you need to cycle the gun after an empty mag
    soundRack:
      path: /Audio/_Battlefield14/Weapons/Guns/AK_GENERIC/rack.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: BF14MagazineRifleAK74
        insertSound: /Audio/_Battlefield14/Weapons/Guns/AK_545/uc_ak_magin.ogg
        ejectSound: /Audio/_Battlefield14/Weapons/Guns/AK_545/uc_ak_magout.ogg
        priority: 2
        whitelist:
          tags:
            - BF14MagazineRifleAK74
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BF14CartridgeRifle545x39
        priority: 1
        whitelist:
          tags:
            - BF14CartridgeRifle545x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag-ak74
    steps: 1
    zeroVisible: true
  - type: Appearance

