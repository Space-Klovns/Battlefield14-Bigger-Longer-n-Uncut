- type: entity
  parent: GrenadeBase
  id: BF14GrenadeBaseOffensive
  description: "Has a random timer between 3-5 seconds."
  abstract: true
  components:
  - type: TriggerOnUse # BF14-BLU: OnUseTimerTrigger, split as upstream did
    keyOut: use
  - type: TimerTrigger
    keysIn:
    - use
    keyOut: null # BF14-BLU: no key, so every effect goes off, as all of them did in BF14
    delay: 3.5
  - type: RandomTimerTrigger
    min: 3
    max: 5
  - type: Tag
    tags:
      - BF14Grenade
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: BF14HandGrenade
    maxIntensity: 10
    intensitySlope: 4
    totalIntensity: 100
    canCreateVacuum: false
  - type: TimerTriggerVisuals
    primingSound:
      path: "/Audio/_Battlefield14/Weapons/Grenades/trigger2.ogg"
  - type: EmitSoundOnPickup
    sound: /Audio/_Battlefield14/Weapons/Grenades/grab1.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/_Battlefield14/Weapons/Grenades/drop1.ogg
  - type: EmitSoundOnLand
    sound:
      collection: BF14FragGrenadeSFX

