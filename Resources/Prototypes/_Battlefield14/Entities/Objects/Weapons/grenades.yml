- type: entity
  name: M33A1 offensive impact grenade
  description: "An early iteration of the M67 hand grenade with an impact fuse. Activate to pull the pin, arming the contact fuze, activate again to disarm. Will bounce off walls. Produces shrapnel. Useless without gravity."
  parent: BaseItem
  id: BF14ImpactGrenadeUSM33A1
  components:
  - type: Item
    size: Small
  - type: Tag
    tags:
      - BF14Grenade
  - type: Sprite
    sprite: _WorldAblaze1968/Objects/Weapons/Explosives/m67.rsi
    layers:
    - state: icon
    - state: primed
      visible: false
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/_Battlefield14/Weapons/Grenades/trigger2.ogg
    soundDeactivate:
      path: /Audio/_Battlefield14/Weapons/Grenades/disable1.ogg
  - type: Damageable
    damageModifierSet: BF14Grenade
  - type: Injurable # BF14-BLU: the damage container moved here from Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ComponentToggler
    components:
    - type: DamageOnLand
      damage:
        types:
          Blunt: 60
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: BF14HandGrenade
    totalIntensity: 30
    intensitySlope: 4
    maxIntensity: 6
    maxTileBreak: 0
    canCreateVacuum: false
  - type: ContainerContainer # BF14-BLU: declared, so it does not gain one on spawn
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    triggerKey: trigger # BF14-BLU: set off by Destructible's trigger key, not a timer
    fillPrototype: BF14BulletGrenadeF1Fragment
    capacity: 60
  - type: EmitSoundOnPickup
    sound: /Audio/_Battlefield14/Weapons/Grenades/grab1.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/_Battlefield14/Weapons/Grenades/drop1.ogg
  - type: EmitSoundOnLand
    sound:
      collection: BF14FragGrenadeSFX

