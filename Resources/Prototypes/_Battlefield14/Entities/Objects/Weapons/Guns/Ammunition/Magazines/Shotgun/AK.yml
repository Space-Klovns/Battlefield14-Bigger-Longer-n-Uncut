- type: entity
  parent: BF14BaseMagazineRifle
  id: BF14MagazineShotgunKSK
  name: "KS-K magazine (12 Gauge buckshot)"
  description: 8 round 12 gauge magazine for the KS-K automatic shotgun.
  components:
  - type: Tag
    tags:
      - BF14Magazine
      - BF14MagazineShotgunKSK
  - type: BallisticAmmoProvider
    proto: BF14CartridgeShotgun12GaugeBuckshot
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeShotgun12Gauge
    capacity: 10
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Shotgun/KSK.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BF14MagazineShotgunKSK
  id: BF14MagazineShotgunKSKSlug
  name: "KS-K magazine (12 Gauge slug)"
  components:
  - type: BallisticAmmoProvider
    proto: BF14CartridgeShotgun12GaugeSlug
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeShotgun12Gauge
    capacity: 10

- type: entity
  parent: BF14MagazineShotgunKSK
  id: BF14MagazineShotgunKSKBreaching
  name: "KS-K magazine (12 Gauge breaching)"
  components:
  - type: BallisticAmmoProvider
    proto: BF14CartridgeShotgun12GaugeBreaching
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeShotgun12Gauge
    capacity: 10
