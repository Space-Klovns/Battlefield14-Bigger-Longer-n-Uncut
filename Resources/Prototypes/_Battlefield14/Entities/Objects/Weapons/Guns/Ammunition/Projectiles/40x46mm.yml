- type: entity
  id: BF14Bullet40x46mmChemicalSmokeInfantry
  name: 40x46mm CS gas shell
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 80
        Blunt: 40
    deleteOnCollide: true
