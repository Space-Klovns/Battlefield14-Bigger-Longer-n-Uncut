- type: entity
  id: BF14BulletGrenadeM67Fragment
  name: M67 grenade fragment
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Slash: 8
        Piercing: 8
  - type: StaminaDamageOnCollide
    damage: 5 # ~20 hits to stun
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: shard
  - type: TimedDespawn
    lifetime: 1
  - type: PointLight
    radius: 1
    color: orange
    energy: 0.2

