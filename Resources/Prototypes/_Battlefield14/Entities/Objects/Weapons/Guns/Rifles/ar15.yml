- type: entity
  name: M16A1
  parent: BaseWeaponRifle
  id: BF14WeaponRifleUSM16A1
  description: "The original rifle that started the M16 and M4 family of rifles, nowadways most western made guns copy it. Takes STANAG magazines."
  components:
  - type: Item # Controls inhand sprites
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR15/M16A1.rsi
  - type: Icon
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR15/iconstates.rsi
    state: icon-full-M16A1
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR15/iconstates.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: grip
      - state: carryhandle
      - state: stock-full
      - state: rifle-length-barrel-M16
      - state: muzzle-brake
        offset: 0.19,0
      - state: mag-20-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR15/M16A1.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -47
    maxAngle: -30
  - type: Gun
    minAngle: 50 # 3
    maxAngle: 50 # 20
    angleIncrease: 2
    angleDecay: 80
    projectileSpeed: 55 # twenty inch barrel
    availableModes:
    - SemiAuto
    - FullAuto
    selectedMode: FullAuto
    soundGunshot:
      collection: BF14M16Gunshots
      params:
        volume: -5
        variation: 0.125
    fireRate: 12.5 # 750 RPM
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Battlefield14/Weapons/Guns/M16/rack.ogg
      params:
        volume: -2
    soundBoltClosed:
      path: /Audio/_Battlefield14/Weapons/Guns/M16/uc_m16_chamber_press.ogg
      params:
        volume: -5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: BF14MagazineRifleSTANAGShort
        insertSound: /Audio/_Battlefield14/Weapons/Guns/M16/uc_m16_magin.ogg
        ejectSound: /Audio/_Battlefield14/Weapons/Guns/M16/uc_m16_magout.ogg
        priority: 2
        whitelist:
          tags:
            - BF14MagazineRifleSTANAG
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BF14CartridgeRifle556x45
        priority: 1
        whitelist:
          tags:
            - BF14CartridgeRifle556x45
  - type: MagazineVisuals
    magState: mag-20
    steps: 1
    zeroVisible: true
  - type: Appearance

