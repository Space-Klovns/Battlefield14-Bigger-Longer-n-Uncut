- type: entity
  name: M870
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: BF14WeaponShotgunUSM870
  description: A popular civilian hunting shotgun, adapted for military use with a heatshield, pistol grip stock, and handy sling.
  components:
  - type: ContainerContainer # BF14-BLU: its ammo container, declared as upstream ammo providers do (UninitializedSaveTest)
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Large
    sprite: _Battlefield14/Objects/Weapons/Guns/Shotguns/M870.rsi
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Shotguns/M870.rsi
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/Shotguns/M870.rsi
  - type: GunRequiresWield
  - type: Gun
    fireRate: 1
    projectileSpeed: 35
    soundGunshot:
      collection: BF14M870Gunshots
      params:
        volume: -5
        variation: 0.125
  - type: GunSpreadModifier
    spread: 0.6
  - type: Tag
    tags:
    - WeaponShotgunKammerer
  - type: BallisticAmmoProvider
    autoCycle: true
    whitelist:
      tags:
      - BF14CartridgeShotgun12Gauge
    capacity: 7
    proto: BF14CartridgeShotgun12GaugeBuckshot
    soundInsert:
      collection: BF14M870ShellIn
      params:
        volume: -5

