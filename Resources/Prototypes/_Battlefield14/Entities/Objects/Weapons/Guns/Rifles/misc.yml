- type: entity
  name: M-30 MR-C
  parent: BaseWeaponRifle
  id: BF14WeaponRifleUSM30MRC
  description: Cal 4.73x33, model 30, modular rifle caseless. The culmination of decades of research into caseless ammunition, the first practical caseless rifle.
  components:
  - type: Item
    size: Huge
    sprite: _Mono/Objects/Weapons/Guns/Rifles/lecter_inhands_32x.rsi
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/lecter.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/lecter_inhands_32x.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -47
    maxAngle: -30
  - type: Gun
    minAngle: 50 # 3
    maxAngle: 50 # 20
    angleIncrease: 2
    angleDecay: 80
    availableModes:
    - SemiAuto
    - FullAuto
    - Burst
    selectedMode: FullAuto
    fireRate: 12.5 # 750 RPM
    projectileSpeed: 45
    shotsPerBurst: 3
    burstCooldown: 0.3
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/light_rifle_1.ogg
  - type: ChamberMagazineAmmoProvider
    boltClosed: null # It's caseless so it doesn't need a bolt, see G11
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: BF14MagazineRifleM30MRC
        insertSound: /Audio/_Mono/Weapons/Guns/SmallArms/MagIn/m16_magin.ogg
        ejectSound: /Audio/_Mono/Weapons/Guns/SmallArms/MagOut/skm_magout.ogg
        priority: 2
        whitelist:
          tags:
            - BF14MagazineRifleM30MRC
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BF14CartridgeRifle473x33
        priority: 1
        whitelist:
          tags:
            - BF14CartridgeRifle473x33
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 750

