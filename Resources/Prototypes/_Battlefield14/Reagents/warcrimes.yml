- type: reagent
  id: BF14WhitePhosphorus
  name: reagent-name-white-phosphorus
  parent: BasePyrotechnic
  desc: reagent-desc-white-phosphorus
  physicalDesc: reagent-physical-desc-chalky
  flavor: bitter
  color: "#ffffff"
#  flammability: 2 # BF14-BLU: removed, KS14 reagents have no flammability
  tileReactions:
  - !type:FlammableTileReaction {}
  metabolisms:
    Bloodstream: # BF14-BLU: was Poison
      metabolismRate: 0.2
      effects:
      - !type:Flammable # BF14-BLU: was FlammableReaction
        multiplier: 0.4
      - !type:HealthChange
        conditions:
        damage:
          types:
            Heat: 1
            Caustic: 1
            Poison: 1
      - !type:AdjustTemperature
        amount: 6000
      - !type:Ignite
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable # BF14-BLU: was FlammableReaction
        multiplier: 1
      - !type:Ignite
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Heat: 2.5
            Caustic: 2.5
      - !type:Emote
        emote: Scream
        probability: 0.3
