- type: entity
  id: BF14CartridgeSMAWHEDM
  name: "SMAW cartridge (HEDM)"
  parent: BF14BaseCartridgeLauncher
  description: "High explosive dual mode, explodes on contact in a small area to blast open walls and such. This item can be stored on your auxillary suit storage slot."
