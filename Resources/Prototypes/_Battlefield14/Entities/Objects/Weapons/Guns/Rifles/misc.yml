  suffix: ar3
  components:
  - type: Icon
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR2.rsi
    state: icon
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR2.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/Rifles/AR2.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -42
    maxAngle: -42
  - type: Gun
    minAngle: 50 # 8
    maxAngle: 50 # 8
    angleIncrease: 3
    angleDecay: 2
    projectileSpeed: 50
    availableModes:
    - SemiAuto
    - FullAuto
    selectedMode: FullAuto
    soundGunshot:
      path: /Audio/_Battlefield14/Weapons/Guns/pulse/ar2_shot.ogg
    soundEmpty: /Audio/_Battlefield14/Weapons/Guns/pulse/empty.ogg
    fireRate: 12.5 # 750 RPM
  - type: ChamberMagazineAmmoProvider
    soundBoltClosed:
