- type: entity
  parent: BF14BaseMagazineSMG
  id: BF14MagazineSubmachinegunMP7
  name: MP7 magazine (4.6x30mm)
  description: A bunch of itty bitty bullets that like to go ZIP right through you, packaged all neat.
  components:
  - type: Tag
    tags:
      - BF14MagazinePistolMP7
      - BF14Magazine
      - BF14PistolMagazine
  - type: BallisticAmmoProvider
    proto: BF14CartridgePDW46x30
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgePDW46x30
    capacity: 40
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/PDW/MP7.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

