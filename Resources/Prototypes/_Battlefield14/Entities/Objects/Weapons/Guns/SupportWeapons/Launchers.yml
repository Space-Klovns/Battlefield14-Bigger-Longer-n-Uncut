- type: entity
  id: BF14WeaponHandlingLauncher
  description: "Has a minimum arming distance of 6 tiles."
  abstract: true
  components:
  - type: UseDelay
    delay: 1.75
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: SpeedModifiedOnWield
    walkModifier: 0.70
    sprintModifier: 0.70
  - type: KsWieldDelay
    baseDelay: 1.75
    preventFiring: true
  - type: KsWieldedCrosshair
    crosshair:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all

- type: entity
  id: BF14WeaponHandlingLauncherDisposable
  description: "Has a minimum arming distance of 6 tiles."
  abstract: true
  components:
  - type: UseDelay
    delay: 1
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: SpeedModifiedOnWield
    walkModifier: 0.70
    sprintModifier: 0.70
  - type: KsWieldDelay
    baseDelay: 1
    preventFiring: true
  - type: Wieldable
    unwieldOnUse: true
  - type: KsWieldedCrosshair
    crosshair:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all

# BF14-BLU: ported from Battlefield14

- type: entity
  parent: BaseItem
  id: BF14BaseWeaponLauncherDisposableFolded
  description: "Use to unfold. This weapon can be stored on your auxillary suit storage slot."
  abstract: true
  suffix: folded
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Launchers/SMAWD.rsi
    layers:
      - state: icon-storage
  - type: Clothing
    quickEquip: false
    unequipDelay: 1
    sprite: _Battlefield14/Objects/Weapons/Guns/Launchers/SMAWD.rsi
    slots:
    - Back
    - suitStorage
    - SUITSTORAGE2
    clothingVisuals:
      suitstorage2:
      - state: equipped-BACKPACK
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
    - id: BF14WeaponLauncherUSSMAWDisposable
    sound:
      path: /Audio/_Goobstation/Items/weapons/Sniper/pickup2.ogg
      params:
        variation: 0.125

