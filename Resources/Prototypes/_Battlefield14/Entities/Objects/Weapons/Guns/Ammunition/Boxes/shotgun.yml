- type: entity
  parent: [BaseAmmoProvider, RecyclableItemCardboard]
  id: BF14BaseShellBox12Gauge
  abstract: true
  components:
    - type: Sprite
      sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Boxes/12gbox.rsi
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
        - BF14CartridgeShotgun12Gauge
      capacity: 30
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: Appearance

- type: entity
  name: shotgun shell box (12 gauge Breaching)
  parent: BF14BaseShellBox12Gauge
  id: BF14ShellBox12GaugeBreaching
  components:
    - type: BallisticAmmoProvider
      proto: BF14CartridgeShotgun12GaugeBreaching
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: practice

