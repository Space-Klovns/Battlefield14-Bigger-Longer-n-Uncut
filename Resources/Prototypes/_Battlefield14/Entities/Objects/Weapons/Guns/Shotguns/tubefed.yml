- type: entity
  name: SPAS-12
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: BF14WeaponShotgunUSSPAS12
  description: Special Purpose Automatic Shotgun; tried to rebrand into a Sporting purpose (automatic shotgun) to get around the assault weapons ban, which didn't work. # Comes with a handy claw for firing one handed
  components:
  - type: ContainerContainer # BF14-BLU: its ammo container, declared as upstream ammo providers do (UninitializedSaveTest)
