- type: entity
  parent: BF14BaseMagazineRifle
  id: BF14MagazineRifleSTANAG
  name: "STANAG magazine"
  description: "STANdardised AGreement magazine, standard for most NATO weaponry, can fit in platforms like the M16, L85, and the M249 believe it or not. Feeds 5.56x45mm."
  components:
  - type: Tag
    tags:
      - BF14MagazineRifleSTANAG
      - BF14Magazine
  - type: BallisticAmmoProvider
    proto: BF14CartridgeRifle556x45
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeRifle556x45
    capacity: 30
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Rifle/STANAG.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

