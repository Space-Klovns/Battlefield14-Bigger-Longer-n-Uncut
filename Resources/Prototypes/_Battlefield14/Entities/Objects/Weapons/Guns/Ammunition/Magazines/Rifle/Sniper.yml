- type: entity
  parent: BF14BaseMagazineRifle
  id: BF14MagazineSniperIntervention
  name: "Intervention magazine"
  description: "A 5 round magazine for the M200 Intervention. Feeds .408 CT."
  components:
  - type: Tag
    tags:
      - BF14MagazineSniperIntervention
      - BF14Magazine
  - type: BallisticAmmoProvider
    proto: BF14CartridgeRifle408CT
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeRifle408CT
    capacity: 5
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Sniper/M107.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

