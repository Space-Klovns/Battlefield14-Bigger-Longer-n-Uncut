- type: entity
  name: M249 Para
  parent: BaseWeaponLightMachineGun
  id: BF14WeaponMachineGunUSM249Para
  description: "A specialised version of the M249 for use by paratroopers, with a shorter barrel and collapsing stock meaning it's easier to haul around but has a lower muzzle velocity compared to other machine guns. Particularly useful for room clearing. Takes STANAG magazines and M249 belt boxes."
  components:
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/MachineGuns/M249Para.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Battlefield14/Objects/Weapons/Guns/MachineGuns/M249Paraworn.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -16
    maxAngle: -35
  - type: Gun
    minAngle: 20 # Wielded = 4
    maxAngle: 50 # wielded = 15
    angleIncrease: 1
    angleDecay: 20
    availableModes:
    - FullAuto
    - Burst
    selectedMode: FullAuto
    fireRate: 14 # ~850 RPM
    projectileSpeed: 40 # 13 inch barrel
    shotsPerBurst: 8 # Fictional, to help with conserving ammo
    burstCooldown: 0.5
    soundGunshot:
      collection: BF14M249Gunshots
      params:
        volume: -5
        variation: 0.125
  - type: ChamberMagazineAmmoProvider
    boltClosed: false
    autoOpenBoltOnEmpty: false
    soundRack:
      path: /Audio/_Battlefield14/Weapons/Guns/M249/uc_m249_rack.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: BF14MagazineBeltBoxM249
        insertSound: /Audio/_Battlefield14/Weapons/Guns/M249/uc_m249_boxinsert.ogg
        ejectSound: /Audio/_Battlefield14/Weapons/Guns/M249/uc_m249_boxremove.ogg
        swap: false
        priority: 2
        whitelist:
          tags:
            - BF14MagazineBeltBoxM249
            - BF14MagazineRifleSTANAG # It can do this in real life you know
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: BF14CartridgeRifle556x45TracerRed
        priority: 1
        whitelist:
          tags:
            - BF14CartridgeRifle556x45
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: SpeedModifiedOnWield
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: GunRequiresWield
  - type: KsWieldedCrosshair
    crosshair:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
  - type: KsWieldDelay
    baseDelay: 1
    preventFiring: true

