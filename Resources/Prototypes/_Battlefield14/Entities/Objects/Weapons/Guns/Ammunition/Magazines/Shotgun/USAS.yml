- type: entity
  parent: BF14BaseMagazineRifle
  id: BF14MagazineShotgunUSAS
  name: "USAS-12 magazine (12 Gauge buckshot)"
  description: 8 round 12 gauge magazine for the USAS-12 automatic shotgun.
  components:
  - type: Tag
    tags:
      - BF14Magazine
      - BF14MagazineShotgunUSAS
  - type: BallisticAmmoProvider
    proto: BF14CartridgeShotgun12GaugeBuckshot
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeShotgun12Gauge
    capacity: 8
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Shotgun/USAS.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BF14BaseMagazineRifle
  id: BF14MagazineShotgunUSASDrum
  name: "USAS-12 drum magazine (12 Gauge buckshot)"
  description: 20 round 12 gauge magazine for the USAS-12 automatic shotgun.
  components:
  - type: Item
    size: Normal
  - type: Tag
    tags:
      - BF14Magazine
      - BF14MagazineShotgunUSASDrum
  - type: BallisticAmmoProvider
    proto: BF14CartridgeShotgun12GaugeBuckshot
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeShotgun12Gauge
    capacity: 20
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Shotgun/USASdrum.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
