- type: entity
  parent: BF14BaseMagazineRifle
  id: BF14MagazineRifleAK74
  name: "AK-74 magazine"
  description: "Classic rock-and-lock magazine in 5.45, for 74 pattern rifles. Has an AK-74 pattern locking system. Feeds 5.45x39mm."
  components:
  - type: Tag
    tags:
      - BF14MagazineRifleAK74
      - BF14Magazine
  - type: BallisticAmmoProvider
    proto: BF14CartridgeRifle545x39
    mayTransfer: true
    whitelist:
      tags:
        - BF14CartridgeRifle545x39
    capacity: 30
  - type: Sprite
    sprite: _Battlefield14/Objects/Weapons/Guns/Ammunition/Magazines/Rifle/AK74.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

